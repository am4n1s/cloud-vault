apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: cloud-vault
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://prometheus-service:9090
        isDefault: true
        editable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: cloud-vault
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'cloud-vault'
        folder: 'Cloud Vault'
        type: file
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-json
  namespace: cloud-vault
data:
  cloud-vault.json: |
    {
      "title": "Cloud Vault Metrics",
      "panels": [
        {
          "id": 1,
          "title": "Authorization Failures (403)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "targets": [
            {
              "expr": "increase(http_server_requests_seconds_count{status=\"403\"}[5m])",
              "legendFormat": "403 Errors"
            }
          ]
        },
        {
          "id": 2,
          "title": "Total HTTP Requests",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "targets": [
            {
              "expr": "increase(http_server_requests_seconds_count[5m])",
              "legendFormat": "{{method}} {{uri}} {{status}}"
            }
          ]
        },
        {
          "id": 3,
          "title": "JVM Memory Usage",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "targets": [
            {
              "expr": "jvm_memory_used_bytes",
              "legendFormat": "{{area}}"
            }
          ]
        },
        {
          "id": 4,
          "title": "Active HTTP Requests",
          "type": "stat",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "targets": [
            {
              "expr": "http_server_requests_seconds_count",
              "legendFormat": "Requests"
            }
          ]
        }
      ],
      "schemaVersion": 36,
      "version": 1
    }
