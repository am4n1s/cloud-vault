apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: cloud-vault
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: 'cloud-vault'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['cloud-vault-service:8080']
        basic_auth:
          username: 'admin'
          password: 'admin123'
